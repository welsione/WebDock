name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck (main)
        run: npx tsc --project tsconfig.node.json --noEmit
      - name: Typecheck (renderer)
        run: npx tsc --project tsconfig.web.json --noEmit
      - name: Unit tests
        run: npm test
      - name: Coverage thresholds
        run: npm run test:coverage
